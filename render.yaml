services:
  - type: web
    name: gic-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      # Do not set PORT — Render injects it and the app binds 0.0.0.0:$PORT
      - key: NODE_ENV
        value: production
      # Fill these in Render's dashboard (Environment tab) or with sync: false
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      - key: PRODUCTION_URL
        sync: false
      - key: DEVELOPMENT_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
